<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <div class="app-header">
        <div class="app-title">
          <span class="app-icon">✅</span>
          <h1>My Todos</h1>
        </div>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light theme">🌙</button>
      </div>

      <form id="todo-form" class="todo-form">
        <label for="todo-input" class="visually-hidden">Add a todo</label>
        <input
          id="todo-input"
          type="text"
          placeholder="What needs to be done?"
          autocomplete="off"
          required
        />
        <button type="submit">
          <span class="btn-icon">+</span>
          <span>Add</span>
        </button>
      </form>

      <div class="list-header">
        <span class="list-label">Tasks</span>
        <span id="task-count" class="task-count">0 items</span>
      </div>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <p id="empty-state" class="empty-state">No tasks yet — add one above! 🎉</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
